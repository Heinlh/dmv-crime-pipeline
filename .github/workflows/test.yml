name: Tests

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      # unit, integration, end to end, and browser tiers; none of them
      # touch the network except the browser tier loading the site's CDN
      # libraries, exactly as a visitor's browser does
      - run: python -m pytest -ra
